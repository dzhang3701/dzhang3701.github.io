<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Build text one token at a time with DistilGPT-2 running locally. View real token probabilities and sample from the distribution.">
  <title>Token builder</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Token builder</h1>
      <div class="model-line"><a href="https://huggingface.co/distilbert/distilgpt2" target="_blank" rel="noopener" title="82M parameters · local inference">DistilGPT-2</a><span id="model-status" role="status" aria-live="polite">Not loaded</span></div>
    </header>
    <div id="load-progress" class="load-progress" hidden><progress id="download" max="100" value="0"></progress><span id="download-label"></span></div>
    <p id="error" class="error" role="alert" hidden></p>

    <section class="text-section" aria-label="Text workspace">
      <details id="prompt-editor" open>
        <summary>Prompt</summary>
        <label class="sr-only" for="prompt">Prompt text</label>
        <textarea id="prompt" rows="2" spellcheck="false" dir="auto">She opened the door and</textarea>
        <div class="prompt-actions">
          <button id="start" class="primary">Load & start</button>
          <select id="examples" aria-label="Example prompts">
            <option value="">Examples</option>
            <option value="The capital of France is">The capital of France is</option>
            <option value="She opened the door and">She opened the door and</option>
            <option value="In a quiet forest, a small">In a quiet forest, a small</option>
            <option value="def fibonacci(n):">def fibonacci(n):</option>
          </select>
          <span id="load-note" title="Downloaded once, cached locally. Prompt text stays on this device.">85 MB · local</span>
        </div>
      </details>

      <div id="continuation" hidden>
        <div id="sentence" class="sentence" aria-live="polite" dir="auto"></div>
      </div>
      <div class="workspace-toolbar">
        <div class="generation-actions">
          <button id="sample" class="primary" disabled>Sample</button>
          <button id="greedy" disabled>Greedy</button>
          <button id="auto" disabled>Auto · 20</button>
          <button id="undo" class="text-button" disabled>Undo</button>
          <button id="reset" class="text-button" disabled>Reset</button>
          <button id="copy" class="text-button" disabled>Copy</button>
        </div>
        <div class="text-meta"><span id="token-count">0 tokens</span><span id="inference-status" role="status" aria-live="polite"></span></div>
      </div>
    </section>

    <section class="probability-section" aria-labelledby="probability-heading">
      <div class="distribution-toolbar">
        <h2 id="probability-heading">Next token</h2>
        <div class="controls">
          <div class="control">
            <label for="temperature">Temperature <output id="temperature-value">1.00</output></label>
            <input id="temperature" type="range" min="0" max="2" step="0.05" value="1" title="0 = greedy">
          </div>
          <div class="control">
            <label for="top-k">Top-k <output id="top-k-value">Off</output></label>
            <input id="top-k" type="range" min="0" max="200" step="1" value="0" title="0 = off">
          </div>
          <div class="control">
            <label for="top-p">Top-p <output id="top-p-value">Off</output></label>
            <input id="top-p" type="range" min="0.01" max="1" step="0.01" value="1" title="1 = off">
          </div>
        </div>
      </div>

      <section id="draw-section" class="draw-section" aria-label="Last token sample" hidden>
        <div class="draw-toolbar"><span>Last draw</span><span id="draw-result"></span></div>
        <div id="draw-plot" class="draw-plot" aria-label="Cumulative sampling probability intervals">
          <div id="draw-segments" class="segments"></div>
          <div id="draw-marker" class="marker" hidden><span id="draw-number"></span></div>
        </div>
        <div class="axis"><span>0</span><span>0.25</span><span>0.5</span><span>0.75</span><span>1</span></div>
      </section>

      <div class="table-toolbar">
        <input id="search" type="search" placeholder="Find a token…" aria-label="Search vocabulary" title="Search text or #token ID" disabled>
        <label class="checkbox"><input id="show-removed" type="checkbox"> Show filtered</label>
        <span id="distribution-summary">50,257 tokens</span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead><tr><th scope="col">#</th><th scope="col">Token</th><th scope="col" title="Model and sampling probabilities on the same relative scale"><span class="sr-only">Probability bars</span></th><th scope="col"><span class="key raw"></span> Model</th><th scope="col"><span class="key final"></span> Sample</th><th scope="col">Logit</th></tr></thead>
          <tbody id="probabilities"><tr><td colspan="6" class="table-empty">—</td></tr></tbody>
        </table>
      </div>
      <div class="table-footer"><span id="table-caption"></span><button id="more" class="text-button" hidden>More</button></div>
    </section>
    <footer><a href="https://github.com/dzhang3701/dzhang3701.github.io/tree/main/token-builder">Source</a><a href="https://lmviz.com/probabilities" target="_blank" rel="noopener">LMVIZ ↗</a></footer>
  </main>
</body>
</html>
